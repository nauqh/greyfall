name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      # The art pack is not in the repo and the build does not read it: every
      # reference to it is a runtime URL under public/, so nothing here needs
      # the files. Serving the app does. A deploy runs `pnpm assets --require`
      # with TINY_SWORDS_URL set, which fails loudly rather than shipping a
      # game with no graphics.
      - run: pnpm --filter @greyfall/web build
        env:
          TINY_SWORDS_URL: ${{ secrets.TINY_SWORDS_URL }}
