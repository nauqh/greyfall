name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      # No art pack here, and none needed: the build never reads it, because
      # every reference is a runtime URL under public/. Serving the app is what
      # needs the files, so a deploy sets TINY_SWORDS_S3 and AWS credentials
      # and runs `pnpm assets --require`, which fails loudly rather than
      # shipping a game with no graphics.
      - run: pnpm --filter @greyfall/web build
